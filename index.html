<!DOCTYPE html>
<html>
<head>
  <title>Movie List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGIN SECTION -->
  <div id="authSection" style="display:none;">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
  </div>

  <!-- USERNAME SETUP (shown after signup or if user has no displayName) -->
  <div id="usernameSection" style="display:none;">
    <h2>Choose a username</h2>
    <input id="usernameInput" placeholder="Enter a username">
    <button id="setUsernameBtn">Set Username</button>
  </div>

  <hr>

  <!-- APP SECTION -->
  <div id="appSection" style="display:none;">
    <h1 id="welcomeHeader">Welcome <span id="usernameDisplay"></span> <button id="logoutBtn" style="margin-left:16px;">Logout</button></h1>

    <h2>Movies to watch:</h2>
    <ul id="moviesList"></ul>

    <input id="movieInput" placeholder="Add movie">
    <button onclick="addMovie()">Add</button>

    <h2>Shows to watch:</h2>
    <ul id="showsList"></ul>

    <input id="showInput" placeholder="Add show">
    <button onclick="addShow()">Add</button>
  </div>

  <div id="adminPanel" style="display:none; padding:20px; border-top:2px solid #ccc;">

    <h2>🛠 Admin Panel</h2>

    <div style="display:flex; gap:20px;">

      <!-- USERS LIST -->
      <div style="width:200px;">
        <h3>Users</h3>
        <ul id="userList" style="list-style:none; padding:0;"></ul>
      </div>

      <!-- USER DETAILS -->
      <div style="flex:1; border-left:1px solid #ddd; padding-left:20px;">
        <h3>User Data</h3>
        <div id="userData" style="background:#f5f5f5; padding:10px; border-radius:8px;">
          Click a user to view details
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
