<!DOCTYPE html>
<html>
<head>
  <title>Movie List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <!-- LOGIN SECTION -->
  <div id="authSection" style="display:none;">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
  </div>

  <!-- USERNAME SETUP (shown after signup or if user has no displayName) -->
  <div id="usernameSection" style="display:none;">
    <h2>Choose a username</h2>
    <input id="usernameInput" placeholder="Enter a username">
    <button id="setUsernameBtn">Set Username</button>
  </div>

  <hr>

  <!-- APP SECTION -->
  <div id="appSection" style="display:none;">
    <h1 id="welcomeHeader">Welcome <span id="usernameDisplay"></span> <button id="logoutBtn" style="margin-left:16px;">Logout</button></h1>

    <h2>Movies to watch:</h2>
    <ul id="moviesList"></ul>

    <input id="movieInput" placeholder="Add movie">
    <button onclick="addMovie()">Add</button>

    <h2>Shows to watch:</h2>
    <ul id="showsList"></ul>

    <input id="showInput" placeholder="Add show">
    <button onclick="addShow()">Add</button>
  </div>

  <div id="adminPanel" style="display:none; padding:20px;">

    <h2>🛠 Admin Dashboard</h2>

    <div style="display:flex; height:400px; gap:20px;">

      <!-- LEFT SIDE (details) -->
      <div style="flex:2; border-right:1px solid #ccc; padding-right:20px;">
        <h3>User Details</h3>
        <div id="userData">
          Click a user
        </div>
      </div>

      <!-- RIGHT SIDE (users list) -->
      <div style="flex:1;">
        <h3>👥 Users</h3>
        <ul id="userList" style="list-style:none; padding:0;"></ul>
      </div>

    </div>

  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
